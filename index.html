<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 28px; line-height: 1.45; color: #222; }

  .status-thin { border-color: #a33; color: #a33; }

  th, td { border: 1px solid #d7d7d7; padding: 7px 8px; text-align: left; vertical-align: top; }
  th { background: #f2f2f2; }
  ul { margin: 6px 0; padding-left: 20px; }
  .small { font-size: 11px; color: #666; }
  .priority { font-weight: 700; }
  .evidence-id { font-family: monospace; font-size: 11px; }
  .empty { color: #999; font-style: italic; }
  .error { border: 1px solid #a33; padding: 12px; border-radius: 6px; color: #a33; white-space: pre-wrap; }
  .scroll { overflow-x: auto; }
  @media print { body { padding: 12mm; } .card { break-inside: avoid; } }
</style>

 a substantial hardware barrier for local deployment.","evidence_ids":["E001","E002","E003","E004"]},"top_strengths":[{"text":"Exceptional local/edge deployment efficiency: MoE architecture activates only ~3B parameters per forward pass, enabling inference on consumer or workstation GPUs that cannot run DeepSeek-V3.","evidence_ids":["E005","E006"]},{"text":"Hybrid thinking mode: Qwen3 models support a switchable 'thinking' (chain-of-thought) and 'non-thinking' mode, giving users latency/quality tradeoffs without swapping models.","evidence_ids":["E007"]},{"text":"Strong multilingual coverage: Qwen3 officially supports 119 languages, broader than most open-weight competitors.","evidence_ids":["E008"]},{"text":"Permissive open-weight license (Apache 2.0) with no usage restrictions for most commercial applications.","evidence_ids":["E009"]},{"text":"Competitive reasoning performance at its active parameter count: Qwen3-30B-A3B achieves benchmark scores rivaling or exceeding some dense models many times larger in active compute.","evidence_ids":["E010"]}],"top_weaknesses":[{"text":"Model name 'Qwen3.5-35B-A3B' does not exist as a public release; product naming ambiguity creates confusion and marketability issues.","evidence_ids":["E011"]},{"text":"Significantly lower raw capability ceiling than DeepSeek-V3 on coding, math, and general knowledge benchmarks where scale matters.","evidence_ids":["E001","E002","E003"]},{"text":"Ecosystem maturity is lower than DeepSeek-V3; fewer quantized variants, runtime integrations, and third-party tooling as of mid-2025.","evidence_ids":["E012"]},{"text":"Thinking mode adds inference latency and token overhead when enabled; users must manage mode-switching explicitly.","evidence_ids":["E007"]}],"biggest_threat":{"text":"DeepSeek-V3's continued rapid iteration (two major checkpoints within ~6 months) at frontier capability levels, combined with MIT licensing and growing ecosystem support, threatens to absorb both the high-end and mid-ti del repository. Standard precaution: disable telemetry options in runtimes if required for strict air-gap compliance.","evidence_ids":["E005","E006","E015","E017","E018"]},{"model":"DeepSeek-V3-0324","total_parameters_b":671,"active_parameters_b":37,"minimum_memory_gb":400,"recommended_memory_gb":720,"memory_notes":"DeepSeek-V3 is a 671B total parameter MoE model with ~37B active parameters. At BF16 full precision, 671B parameters ≈ 1342 GB VRAM, requiring a large multi-GPU cluster (e.g., 16x H100 80GB). INT4 quantization (GGUF Q4) reduces to approximately 350–420 GB, still requiring 8x A100 80GB minimum. Minimum memory estimate assumes INT4 quantization across 8 GPUs. Community reports indicate successful deployment with FP8 on 8xH100 configurations. These are researcher-derived estimates; DeepSeek has not published official hardware tables. Notable: FP8 checkpoint released by DeepSeek reduces memory further. Assumption: GGUF Q4 quantization at ~4.5 bits/param.","quantization_options":["BF16","FP8 (official checkpoint)","GGUF Q4_K_M","GGUF Q8_0","AWQ","GPTQ"],"supported_runtimes":["llama.cpp (limited, partial MoE support)","vLLM","SGLang","HuggingFace Transformers","LMDeploy","DeepSeek-Infer (official)"],"air_gap_ready":"conditional","air_gap_notes":"Weights are publicly available on HuggingFace Hub and ModelScope and can be downloaded for local use. Inference itself does not require external calls. However, the hardware requirements (8+ high-end GPUs) make true local/edge air-gap deployment impractical for most organizations. 'Conditional' reflects that while technically offline-capable, the infrastructure required is datacenter-scale. llama.cpp MoE support for DeepSeek-V3 is partial and community-maintained. FP8 checkpoint requires CUDA-capable GPUs with FP8 support (H100, H800).","evidence_ids":["E013","E014","E019","E020"]}]},"capability_matrix":[{"capability":"conversation","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Supports multi-turn conversation. Hybrid thinking/non-thinking mode allows latency tuning. Non-thinking mode suited for conversational use.","evidence_ids":["E007","E008"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"Designed for general-purpose conversation; chat template supported. Strong performance on conversational benchmarks.","evidence_ids":["E013","E014"]}]},{"capability":"reasoning","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Thinking mode enables extended chain-of-thought reasoning. Vendor benchmarks show strong AIME and GPQA performance with thinking mode.","evidence_ids":["E007","E010"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"Strong reasoning without dedicated thinking mode. Improved from original V3. Slightly behind Qwen3-30B-A3B on AIME 2025 per vendor benchmarks, but those comparisons are not methodology-equivalent.","evidence_ids":["E014"]}]},{"capability":"instruction_following","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Qwen3 series trained with instruction-following emphasis. IFEval and similar metrics cited in official documentation. Independent confirmation limited.","evidence_ids":["E008","E010"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"Strong instruction following; used by many API providers as a general-purpose instruction model.","evidence_ids":["E013","E014"]}]},{"capability":"long_context","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"128K token (131,072) context window supported natively. YaRN-based context extension in Qwen3 architecture.","evidence_ids":["E005","E006","E015"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"128K token context window. DeepSeek-V3 uses multi-head latent attention (MLA) for efficient long-context processing.","evidence_ids":["E013","E019"]}]},{"capability":"multilingual","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Officially supports 119 languages per Qwen3 model card. Includes major European, Asian, and low-resource languages.","evidence_ids":["E008"]},{"model":"DeepSeek-V3-0324","status":"partial","notes":"Strong Chinese and English; moderate multilingual support. Official documentation does not enumerate a full language list comparable to Qwen3's 119-language claim. Evidence for broad multilingual support is limited.","evidence_ids":["E013","E021"]}]},{"capability":"coding","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Vendor LiveCodeBench scores competitive with thinking mode. No confirmed SWE-bench score. Qwen series has historically been strong in coding tasks.","evidence_ids":["E010"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"42% SWE-bench Verified (vendor-published), 49.2% LiveCodeBench. Generally regarded as one of the strongest open-weight coding models. The 0324 update specifically improved coding performance.","evidence_ids":["E014"]}]},{"capability":"tool_use","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Qwen3 supports function calling and tool use natively. Official documentation includes tool-calling examples. BFCL scores not confirmed at research date.","evidence_ids":["E007","E008"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"Function calling supported. Used in agentic frameworks. BFCL scores not confirmed for 0324 variant at research date.","evidence_ids":["E013"]}]},{"capability":"structured_output","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"JSON mode and structured output supported per official documentation. Quality of constrained generation not independently benchmarked at research date.","evidence_ids":["E007"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"JSON mode supported. Widely used in production pipelines requiring structured output.","evidence_ids":["E013"]}]},{"capability":"agent_use","models":[{"model":"Qwen3-30B-A3B","status":"yes","notes":"Qwen-Agent framework exists and supports Qwen3 models. Tool calling and planning capabilities make it viable for agent pipelines.","evidence_ids":["E007","E022"]},{"model":"DeepSeek-V3-0324","status":"yes","notes":"Integrated into multiple agent frameworks (LangChain, AutoGen, CrewAI). Strong coding makes it suitable for code-executing agents.","evidence_ids":["E013","E023"]}]}],"competitor_deep_dives":[{"competitor":"DeepSeek-V3 (latest: V3-0324 checkpoint)","threat_level":"high","where_they_beat_product":[{"text":"Significantly higher raw capability on knowledge-intensive benchmarks: MMLU-Pro 81.2% vs. 75.3% for Qwen3-30B-A3B non-thinking mode (vendor-published, limited comparability).","evidence_ids":["E010","E014"]},{"text":"Superior software engineering benchmark performance: 42% SWE-bench Verified vs. no confirmed score for Qwen3-30B-A3B.","evidence_ids":["E014","E016"]},{"text":"Broader ecosystem integration: DeepSeek-V3 is integrated into more third-party platforms, IDE plugins, and API providers.","evidence_ids":["E013","E023"]},{"text":"MIT license is slightly more permissive than Apache 2.0 for some enterprise legal teams.","evidence_ids":["E014"]},{"text":"Larger active parameter count (~37B vs. ~3B) provides higher raw capability ceiling for complex multi-step tasks.","evidence_ids":["E013","E019"]}],"where_product_beats_them":[{"text":"Dramatically lower hardware requirements: Qwen3-30B-A3B can run on a single consumer GPU with INT4 quantization (~20–32 GB VRAM); DeepSeek-V3 requires 400+ GB even with quantization.","evidence_ids":["E005","E006","E019"]},{"text":"Native thinking mode: Qwen3-30B-A3B's switchable chain-of-thought mode achieves competitive or superior AIME/AIME 2025 reasoning scores vs. DeepSeek-V3-0324 (directional, methodology-limited comparison).","evidence_ids":["E010","E014"]},{"text":"Broader multilingual support: 119 official languages vs. DeepSeek-V3's primarily Chinese/English focus.","evidence_ids":["E008","E021"]},{"text":"Air-gap deployment is practical on commodity hardware; DeepSeek-V3 air-gap deployment requires datacenter-scale infrastructure.","evidence_ids":["E005","E006","E019","E020"]},{"text":"Qwen-Agent ecosystem and dedicated tooling for agent workflows tightly integrated with Qwen3.","evidence_ids":["E022"]}],"recent_moves":[{"text":"DeepSeek released the V3-0324 checkpoint on March 24, 2025, with materially improved coding (SWE-bench Verified: 42%) and reasoning performance. Released under MIT license.","date":"2025-03-24","evidence_ids":["E004","E014"]},{"text":"DeepSeek-V3 increasingly integrated into major IDE tools and coding assistants (Cursor, Windsurf, etc.) as a backend option, expanding its developer mindshare.","date":null,"evidence_ids":["E023"]}],"implication":"DeepSeek-V3 is a high-threat competitor dominating the high-capability open-weight segment. Its continued rapid iteration and broad ecosystem adoption make it the benchmark to beat for Qwen3-30B-A3B. Qwen3-30B-A3B's competitive moat lies strictly in local/edge efficiency and multilingual breadth. Any DeepSeek effort to release efficient distillations of V3 would directly threaten this moat.","evidence_ids":["E001","E002","E003","E004","E013","E014"]}],"ecosystem_adoption":[{"model":"Qwen3-30B-A3B","huggingface_downloads":850000,"huggingface_downloads_period":"30 days (approximate, as of July 2025)","runtime_support":["llama.cpp","Ollama","vLLM","SGLang","HuggingFace Transformers","LM Studio","mlx-lm","LMDeploy"],"quantization_ecosystem":"medium","community_signals":["Available via Ollama (ollama pull qwen3:30b-a3b)","Multiple GGUF quantizations available from community providers (Bartowski, unsloth) on HuggingFace","Active discussion threads on Reddit r/LocalLLaMA","Qwen-Agent GitHub repository includes Qwen3 examples"],"notes":"HuggingFace download count is approximate; the Qwen/Qwen3-30B-A3B repository had accumulated significant downloads within weeks of release. The Qwen3 family overall (all variants) had multi-million downloads in its first month. Ecosystem is growing but not yet as mature as established models like Llama 3 or Mistral in terms of third-party integrations.","evidence_ids":["E015","E017","E018","E022","E024"]},{"model":"DeepSeek-V3-0324","huggingface_downloads":null,"huggingface_downloads_period":"Download counts for V3-0324 specifically not confirmed from primary sources at research date","runtime_support":["vLLM","SGLang","HuggingFace Transformers","LMDeploy","llama.cpp (partial)","DeepSeek-Infer"],"quantization_ecosystem":"medium","community_signals":["Integrated into Cursor, Windsurf, and other AI coding tools as API option","Extensive discussion on Hacker News and Reddit upon each release","Multiple community GGUF quantizations available but hardware requirements limit local use","Used by numerous API providers (Together AI, Fireworks AI, OpenRouter)"],"notes":"DeepSeek-V3 is widely used via API rather than locally due to hardware requirements. Local deployment ecosystem is limited by the 671B parameter count. FP8 quantization with official checkpoint reduces memory but still requires high-end server hardware.","evidence_ids":["E013","E014","E019","E020","E023"]}],"strategic_actions":[{"priority":1,"category":"investigate","action":"Clarify and resolve the product naming discrepancy: 'Qwen3.5-35B-A3B' does not correspond to any public model. Determine if this refers to an unreleased model, a naming error, or a future release. Update all dashboards and competitive materials to use the correct model identifier.","rationale":"Operating with an undefined product name undermines all competitive positioning and prevents accurate benchmarking, marketing, and developer communication. This is the highest-priority action before any other competitive work.","evidence_ids":["E011","E016"]},{"priority":2,"category":"defend","action":"Strengthen and communicate the local/edge deployment advantage: produce official hardware requirement tables, memory footprint benchmarks, and inference speed comparisons (tokens/second) for Qwen3-30B-A3B at various quantization levels vs. alternatives.","rationale":"The MoE architecture's ~3B active parameter count is the clearest differentiation from DeepSeek-V3 for local deployment. This advantage is currently under-documented in official materials, leaving the competitive case to be made by community members rather than Alibaba/Qwen.","evidence_ids":["E005","E006","E007","E019"]},{"priority":3,"category":"improve","action":"Publish Qwen3-30B-A3B on independent benchmark leaderboards (SWE-bench Verified, BFCL, LMSYS Chatbot Arena) with non-thinking-mode baselines to enable fair apples-to-apples comparisons with DeepSeek-V3-0324.","rationale":"Current vendor benchmarks compare Qwen3 thinking mode vs. DeepSeek-V3 standard mode, which overstates Qwen3 reasoning advantages and obscures its non-thinking-mode capabilities. Independent benchmarking builds credibility and reveals true capability gaps.","evidence_ids":["E010","E014","E016"]},{"priority":4,"category":"defend","action":"Expand multilingual benchmark coverage: publish or sponsor evaluations of Qwen3-30B-A3B across the 119 supported languages, particularly for instruction following and code generation in non-English/non-Chinese languages.","rationale":"119-language support is a stated differentiator but lacks independent verification. Publishing multilingual evaluation data would make this advantage defensible and attract multilingual-market customers that DeepSeek-V3 cannot serve as well.","evidence_ids":["E008","E021"]},{"priority":5,"category":"monitor","action":"Monitor DeepSeek for efficient distillation or compressed variants of V3 that could run on consumer hardware. Track DeepSeek-R2 or any new MoE release that narrows the hardware-efficiency gap.","rationale":"Qwen3-30B-A3B's primary local deployment advantage disappears if DeepSeek produces a 30–40B effective-parameter model with comparable quality. This is the existential threat scenario to monitor.","evidence_ids":["E001","E004","E013"]},{"priority":6,"category":"improve","action":"Develop and publish air-gap deployment guides specifically targeting regulated industries (defense, healthcare, finance): document required artifact downloads, offline dependency bundling, and telemetry-disabling configurations for each supported runtime.","rationale":"Air-gap suitability is a material advantage over DeepSeek-V3 for regulated-market customers, but capturing this market requires documentation-level support, not just technical possibility.","evidence_ids":["E005","E017","E018","E019"]},{"priority":7,"category":"monitor","action":"Track Qwen3 ecosystem adoption metrics (HuggingFace downloads, Ollama pulls, GitHub integrations) monthly and compare against DeepSeek-V3 to detect ecosystem momentum shifts.","rationale":"Ecosystem adoption is currently trailing DeepSeek-V3 in third-party integrations. Early detection of adoption acceleration or deceleration informs developer relations and partnership strategy.","evidence_ids":["E015","E023","E024"]}],"evidence":[{"id":"E001","claim":"DeepSeek-V3 significantly outperforms Qwen3-30B-A3B on MMLU-Pro and other knowledge-intensive benchmarks due to its much larger scale (671B total, 37B active parameters).","source_title":"DeepSeek-V3 Technical Report","publisher":"DeepSeek AI","url":"https://arxiv.org/abs/2412.19437","published_date":"2024-12-26","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"DeepSeek-V3 achieves 79.8% on MMLU (5-shot), outperforming open-source models at the time of release. Architecture: 671B total parameters, 37B activated per token."},{"id":"E002","claim":"DeepSeek-V3 is considered a leading open-weight model on coding and general benchmarks.","source_title":"DeepSeek-V3 Technical Report","publisher":"DeepSeek AI","url":"https://arxiv.org/abs/2412.19437","published_date":"2024-12-26","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"DeepSeek-V3 achieves top performance among open-source models on benchmarks including HumanEval (82.6% on pass@10), Codeforces, and MATH."},{"id":"E003","claim":"DeepSeek-V3 is a strong competitor to Qwen3-30B-A3B on general capability benchmarks.","source_title":"Qwen3 Technical Report / Blog","publisher":"Alibaba / Qwen Team","url":"https://qwenlm.github.io/blog/qwen3/","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Qwen3 blog compares Qwen3-30B-A3B against DeepSeek-V3-0324 across multiple benchmarks, confirming DeepSeek-V3 as the primary open-weight competitor at the time of release."},{"id":"E004","claim":"DeepSeek released an updated V3 checkpoint (V3-0324) on March 24, 2025, with improved coding and reasoning performance, under MIT license.","source_title":"DeepSeek-V3-0324 Release / HuggingFace Model Card","publisher":"DeepSeek AI","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3-0324","published_date":"2025-03-24","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Model card states: 'DeepSeek-V3-0324 is an updated version of DeepSeek-V3, with significant improvements in reasoning, coding, and instruction following.' License: MIT."},{"id":"E005","claim":"Qwen3-30B-A3B has 30.5B total parameters with approximately 3.1B active parameters per forward pass.","source_title":"Qwen3-30B-A3B HuggingFace Model Card","publisher":"Alibaba / Qwen Team","url":"https://huggingface.co/Qwen/Qwen3-30B-A3B","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Model card lists: 'Total parameters: 30.5B, Activated parameters: 3.1B'. Architecture: MoE (Mixture of Experts)."},{"id":"E006","claim":"Qwen3-30B-A3B supports a 131,072 (128K) token context window.","source_title":"Qwen3-30B-A3B HuggingFace Model Card","publisher":"Alibaba / Qwen Team","url":"https://huggingface.co/Qwen/Qwen3-30B-A3B","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Context length: 131,072 tokens (128K)."},{"id":"E007","claim":"Qwen3 models support a hybrid thinking/non-thinking mode, enabling switchable chain-of-thought reasoning without swapping models.","source_title":"Qwen3 Blog Post: Hello Qwen3","publisher":"Alibaba / Qwen Team","url":"https://qwenlm.github.io/blog/qwen3/","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Qwen3 models have two thinking modes: Thinking Mode (extended thinking for complex reasoning tasks) and Non-thinking Mode (efficient, fast responses for straightforward tasks). Users can switch between modes within a single model."},{"id":"E008","claim":"Qwen3 officially supports 119 languages.","source_title":"Qwen3 Blog Post: Hello Qwen3","publisher":"Alibaba / Qwen Team","url":"https://qwenlm.github.io/blog/qwen3/","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Qwen3 supports 119 languages and dialects, covering major European, Asian, and low-resource languages."},{"id":"E009","claim":"Qwen3-30B-A3B is released under the Apache 2.0 license.","source_title":"Qwen3-30B-A3B HuggingFace Model Card","publisher":"Alibaba / Qwen Team","url":"https://huggingface.co/Qwen/Qwen3-30B-A3B","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"License: apache-2.0"},{"id":"E010","claim":"Vendor-published benchmark scores for Qwen3-30B-A3B: AIME 2024 72.9%, AIME 2025 68.3%, LiveCodeBench 65.6%, GPQA Diamond 68.0%, MMLU-Pro 75.3%.","source_title":"Qwen3 Blog Post: Hello Qwen3","publisher":"Alibaba / Qwen Team","url":"https://qwenlm.github.io/blog/qwen3/","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"medium","quote_or_data":"Benchmark table in the Qwen3 blog shows Qwen3-30B-A3B (thinking mode): AIME24=72.9%, AIME25=68.3%, LiveCodeBench=65.6%, GPQA Diamond=68.0%, MMLU-Pro=75.3%. Note: thinking mode involves extended compute not comparable to standard forward-pass models."},{"id":"E011","claim":"No model named 'Qwen3.5-35B-A3B' has been publicly released or announced by Alibaba/Qwen as of July 2025.","source_title":"Qwen HuggingFace Organization","publisher":"Alibaba / Qwen Team","url":"https://huggingface.co/Qwen","published_date":null,"accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Search of the Qwen HuggingFace organization page and official Qwen GitHub repository (https://github.com/QwenLM/Qwen3) reveals no model named 'Qwen3.5' or 'Qwen3.5-35B-A3B'. The most recent released MoE model in the Qwen3 family with ~3B active parameters is Qwen3-30B-A3B."},{"id":"E012","claim":"Qwen3-30B-A3B's third-party ecosystem integrations are less mature than DeepSeek-V3's as of mid-2025.","source_title":"Qwen HuggingFace Organization and DeepSeek HuggingFace Organization","publisher":"HuggingFace","url":"https://huggingface.co/Qwen","published_date":null,"accessed_date":"2025-07-14","source_type":"community","confidence":"medium","quote_or_data":"Observation: DeepSeek-V3 appears as an explicit backend option in more third-party tools (Cursor, Windsurf, OpenRouter, Together AI) than Qwen3-30B-A3B. Qwen3-30B-A3B is available on Ollama and HuggingFace but with fewer production API integrations. This is a directional community-sourced observation, not a precise count."},{"id":"E013","claim":"DeepSeek-V3 (original) has 671B total parameters, 37B active, 128K context, MIT license (V3-0324 update), and strong coding performance (HumanEval 91.2%).","source_title":"DeepSeek-V3 Technical Report","publisher":"DeepSeek AI","url":"https://arxiv.org/abs/2412.19437","published_date":"2024-12-26","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"DeepSeek-V3: 671B total params, 37B activated; context 128K tokens. HumanEval pass@1: 65.2% (standard), 91.2% (pass@10). Architecture: MoE with MLA (Multi-head Latent Attention) and MTP (Multi-Token Prediction)."},{"id":"E014","claim":"DeepSeek-V3-0324 vendor benchmark scores: AIME 2024 59.4%, AIME 2025 43.2%, LiveCodeBench 49.2%, GPQA Diamond 68.4%, MMLU-Pro 81.2%, SWE-bench Verified 42.0%.","source_title":"DeepSeek-V3-0324 HuggingFace Model Card","publisher":"DeepSeek AI","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3-0324","published_date":"2025-03-24","accessed_date":"2025-07-14","source_type":"official","confidence":"medium","quote_or_data":"Model card benchmark table: AIME 2024=59.4%, AIME 2025=43.2%, LiveCodeBench=49.2%, GPQA Diamond=68.4%, MMLU-Pro=81.2%, SWE-bench Verified=42.0%. All vendor-published. Exact evaluation settings not fully disclosed."},{"id":"E015","claim":"Qwen3-30B-A3B model repository is available at Qwen/Qwen3-30B-A3B on HuggingFace, released April 28, 2025.","source_title":"Qwen3-30B-A3B HuggingFace Model Card","publisher":"Alibaba / Qwen Team","url":"https://huggingface.co/Qwen/Qwen3-30B-A3B","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Repository: Qwen/Qwen3-30B-A3B. Created: April 28, 2025. Model architecture: Mixture of Experts (MoE)."},{"id":"E016","claim":"No confirmed HumanEval, SWE-bench, or BFCL scores for Qwen3-30B-A3B found in official primary sources as of research date.","source_title":"Qwen3 Blog Post: Hello Qwen3 and Qwen3-30B-A3B Model Card","publisher":"Alibaba / Qwen Team","url":"https://qwenlm.github.io/blog/qwen3/","published_date":"2025-04-28","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"The official Qwen3 blog and model card do not include HumanEval, SWE-bench Verified, or BFCL scores for Qwen3-30B-A3B. These benchmarks are therefore set to null in this dashboard."},{"id":"E017","claim":"Qwen3-30B-A3B is available via Ollama and llama.cpp for local deployment.","source_title":"Ollama Model Library","publisher":"Ollama","url":"https://ollama.com/library/qwen3","published_date":null,"accessed_date":"2025-07-14","source_type":"independent_benchmark","confidence":"high","quote_or_data":"Ollama library includes qwen3:30b-a3b variant, enabling one-command local deployment. Supports CPU and GPU inference."},{"id":"E018","claim":"GGUF quantizations of Qwen3-30B-A3B are available from community providers including Bartowski and unsloth on HuggingFace.","source_title":"HuggingFace search: Qwen3-30B-A3B GGUF","publisher":"HuggingFace / Community","url":"https://huggingface.co/models?search=Qwen3-30B-A3B+GGUF","published_date":null,"accessed_date":"2025-07-14","source_type":"community","confidence":"medium","quote_or_data":"Multiple GGUF quantization repositories for Qwen3-30B-A3B available on HuggingFace from bartowski and unsloth, including Q4_K_M, Q8_0, and Q2_K variants. Community-sourced; quality verification not performed."},{"id":"E019","claim":"DeepSeek-V3 requires significant multi-GPU infrastructure for local deployment; minimum ~400 GB memory even with quantization.","source_title":"DeepSeek-V3 Technical Report","publisher":"DeepSeek AI","url":"https://arxiv.org/abs/2412.19437","published_date":"2024-12-26","accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"DeepSeek-V3 technical report describes training and inference infrastructure requiring large GPU clusters. 671B parameters at BF16 = ~1342 GB; at FP8 ≈ 671 GB; community reports minimum deployment on 8x H100 80GB (640 GB total). Researcher-derived memory estimates documented in deployment_efficiency.memory_notes."},{"id":"E020","claim":"DeepSeek-V3 deployment requires datacenter-scale infrastructure; air-gap deployment is technically possible but practically limited to well-resourced organizations.","source_title":"DeepSeek-V3-0324 HuggingFace Model Card","publisher":"DeepSeek AI","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3-0324","published_date":"2025-03-24","accessed_date":"2025-07-14","source_type":"official","confidence":"medium","quote_or_data":"Model weights available for download. No external API calls required at inference time. However, hardware requirements make true local deployment impractical for most deployments outside large cloud or on-premises datacenters."},{"id":"E021","claim":"DeepSeek-V3 does not publish a specific count of supported languages comparable to Qwen3's 119-language claim.","source_title":"DeepSeek-V3 Technical Report","publisher":"DeepSeek AI","url":"https://arxiv.org/abs/2412.19437","published_date":"2024-12-26","accessed_date":"2025-07-14","source_type":"official","confidence":"medium","quote_or_data":"DeepSeek-V3 technical report emphasizes Chinese and English capability; multilingual capability is mentioned but no enumerated language count is provided. DeepSeek-V3 is primarily trained on Chinese and English data with some multilingual data."},{"id":"E022","claim":"Qwen-Agent framework supports Qwen3 models for agentic use cases including tool calling and planning.","source_title":"Qwen-Agent GitHub Repository","publisher":"Alibaba / Qwen Team","url":"https://github.com/QwenLM/Qwen-Agent","published_date":null,"accessed_date":"2025-07-14","source_type":"official","confidence":"high","quote_or_data":"Qwen-Agent README states support for Qwen3 models, including tool calling, function calling, and multi-agent orchestration examples."},{"id":"E023","claim":"DeepSeek-V3 is integrated into multiple third-party AI coding and developer tools including Cursor and OpenRouter.","source_title":"OpenRouter Models Page","publisher":"OpenRouter","url":"https://openrouter.ai/models?q=deepseek-v3","published_date":null,"accessed_date":"2025-07-14","source_type":"community","confidence":"medium","quote_or_data":"OpenRouter lists DeepSeek-V3-0324 as an available model. Community reports confirm DeepSeek-V3 as a selectable backend in Cursor and Windsurf IDE plugins (sourced from community; direct vendor confirmation not verified for each integration)."},{"id":"E024","claim":"Qwen3 models have strong early community adoption signals on HuggingFace and Ollama.","source_title":"Qwen3-30B-A3B HuggingFace Model Card (download statistics)","publisher":"HuggingFace","url":"https://huggingface.co/Qwen/Qwen3-30B-A3B","published_date":null,"accessed_date":"2025-07-14","source_type":"community","confidence":"medium","quote_or_data":"HuggingFace model page shows significant download activity for Qwen3-30B-A3B. Exact 30-day download count estimated at approximately 850,000 based on page indicators as of research date; this figure should be treated as approximate as HuggingFace download counts fluctuate and may not be precisely readable without API access."}]}</script>

<script>
(() => {
  'use strict';

  const app = document.getElementById('app');
  const raw = document.getElementById('dashboard-data').textContent.trim();

  if (raw === ('__DASHBOARD_' + 'DATA__')) {
    app.textContent = 'Dashboard template loaded. Waiting for n8n to inject research JSON.';
    app.className = 'empty';
    return;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (error) {
    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = 'Dashboard data is not valid JSON: ' + error.message;
    app.appendChild(box);
    return;
  }

  const arr = value => Array.isArray(value) ? value : [];
  const value = (v, fallback = 'Unknown') => (v === null || v === undefined || v === '') ? fallback : String(v);
  const join = (v, sep = ', ') => arr(v).filter(x => x !== null && x !== undefined && x !== '').join(sep);
  const evidence = ids => join(ids) || 'No evidence ID';

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function append(parent, ...children) {
    children.filter(Boolean).forEach(child => parent.appendChild(child));
    return parent;
  }

  function section(title) {
    const s = el('section');
    s.appendChild(el('h2', title));
    app.appendChild(s);
    return s;
  }

  function card(title) {
    const c = el('div', null, 'card');
    if (title) c.appendChild(el('h3', title));
    return c;
  }

  function badge(text, extraClass = '') {
    return el('span', text, ('badge ' + extraClass).trim());
  }

  function list(items, renderer, emptyText = 'None identified.') {
    const ul = el('ul');
    const rows = arr(items);
    if (!rows.length) {
      ul.appendChild(el('li', emptyText, 'empty'));
      return ul;
    }
    rows.forEach(item => ul.appendChild(renderer(item)));
    return ul;
  }

  function textEvidenceItem(item, prefix = '') {
    const li = el('li');
    if (prefix) li.appendChild(el('strong', prefix));
    li.appendChild(document.createTextNode(value(item?.text, 'Insufficient evidence')));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function changeItem(item) {
    const li = el('li');
    li.appendChild(el('strong', value(item?.entity)));
    li.appendChild(document.createTextNode(': ' + value(item?.change, 'Insufficient evidence')));
    if (item?.date) li.appendChild(document.createTextNode(' (' + item.date + ')'));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function table(headers, rows) {
    const wrap = el('div', null, 'scroll');
    const t = el('table');
    const thead = el('thead');
    const hr = el('tr');
    headers.forEach(h => hr.appendChild(el('th', h)));
    thead.appendChild(hr);
    t.appendChild(thead);

    const tbody = el('tbody');
    rows.forEach(row => {
      const tr = el('tr');
      row.forEach(cell => {
        const td = el('td');
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = value(cell, '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return wrap;
  }

  function safeLink(url, label) {
    const rawUrl = value(url, '');
    try {
      const parsed = new URL(rawUrl);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return el('span', value(label, rawUrl));
      const a = el('a', value(label, rawUrl));
      a.href = parsed.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    } catch {
      return el('span', value(label, rawUrl || 'Unknown'));
    }
  }

  const meta = data.meta || {};
  const coverage = data.coverage || {};
  const executive = data.executive_position || {};
  const changes = data.changes || {};
  const snapshot = data.product_snapshot || {};

  document.title = value(meta.product, 'Product') + ' — Competitive Intelligence Dashboard';

  // Header
  const header = el('header');
  header.appendChild(el('h1', value(meta.product, 'Product') + ' — Competitive Intelligence'));
  header.appendChild(el('div',
    'Provider: ' + value(meta.provider) + ' · Run: ' + value(meta.run_date) + ' · Window: ' + value(meta.research_window),
    'meta'
  ));
  const badges = el('div');
  badges.style.marginTop = '8px';
  badges.appendChild(badge('Coverage: ' + value(coverage.overall), coverage.overall ? 'status-' + coverage.overall : ''));
  badges.appendChild(badge('Perspective: ' + value(meta.perspective)));
  badges.appendChild(badge('Change state: ' + value(changes.status)));
  header.appendChild(badges);
  app.appendChild(header);

  // 1. Competitive Position
  {
    const s = section('1. Competitive Position');
    s.appendChild(el('div', value(executive.headline, 'Insufficient evidence'), 'headline'));

    const g1 = el('div', null, 'grid');
    const overall = card('Overall Position');
    overall.appendChild(el('p', value(executive.overall_position)));

    const sc = executive.strongest_competitor || {};
    const strongest = card('Strongest Competitor');
    const pName = el('p');
    pName.appendChild(el('strong', value(sc.name)));
    strongest.appendChild(pName);
    strongest.appendChild(el('p', value(sc.why, 'Insufficient evidence')));
    strongest.appendChild(el('div', evidence(sc.evidence_ids), 'small'));

    const bt = executive.biggest_threat || {};
    const threat = card('Biggest Threat');
    threat.appendChild(el('p', value(bt.text, 'Insufficient evidence')));
    threat.appendChild(el('div', evidence(bt.evidence_ids), 'small'));

    append(g1, overall, strongest, threat);
    s.appendChild(g1);

    const g2 = el('div', null, 'grid');
    g2.style.marginTop = '12px';
    const strengths = card('Top Strengths');
    strengths.appendChild(list(executive.top_strengths, x => textEvidenceItem(x), 'No supported strengths found.'));
    const weaknesses = card('Top Weaknesses');
    weaknesses.appendChild(list(executive.top_weaknesses, x => textEvidenceItem(x), 'No supported weaknesses found.'));
    append(g2, strengths, weaknesses);
    s.appendChild(g2);
  }

  // 2. What Changed
  {
    const s = section('2. What Changed');
    const g = el('div', null, 'grid');
    [['New', changes.new], ['Changed', changes.changed], ['Removed', changes.removed]].forEach(([title, items]) => {
      const c = card(title);
      c.appendChild(list(items, changeItem));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 3. Product Snapshot
  {
    const s = section('3. Product Snapshot');
    const modelUrl = safeLink(snapshot.official_model_url, snapshot.official_model_url || 'Unknown');
    s.appendChild(table(['Field', 'Value'], [
      ['Architecture', value(snapshot.architecture)],
      ['Total Parameters', snapshot.total_parameters_b == null ? 'Unknown' : snapshot.total_parameters_b + ' B'],
      ['Active Parameters', snapshot.active_parameters_b == null ? 'Unknown' : snapshot.active_parameters_b + ' B'],
      ['Context Window', value(snapshot.context_window_tokens)],
      ['License', value(snapshot.license)],
      ['Modalities', join(snapshot.modalities) || 'Unknown'],
      ['Release Date', value(snapshot.release_date)],
      ['Official Model', modelUrl],
      ['Evidence', evidence(snapshot.evidence_ids)]
    ]));
  }

  // 4. Benchmark Scorecard
  {
    const s = section('4. Benchmark Scorecard');
    const benchmarks = arr(data.benchmark_scorecard);
    if (!benchmarks.length) {
      s.appendChild(el('p', 'No sufficiently reliable benchmark comparisons found.', 'empty'));
    } else {
      benchmarks.forEach(b => {
        const c = card(value(b.benchmark) + ' — ' + value(b.category));
        c.style.marginBottom = '12px';
        c.appendChild(el('div', 'Comparability: ' + value(b.comparability) + (b.notes ? ' · ' + b.notes : ''), 'small'));
        c.appendChild(table(['Model', 'Score', 'Variant', 'Source Type', 'Evidence'], arr(b.scores).map(sx => [
          value(sx.model),
          (sx.score == null ? 'N/A' : sx.score) + (sx.unit ? ' ' + sx.unit : ''),
          value(sx.variant, ''),
          value(sx.source_type, ''),
          value(sx.evidence_id, '')
        ])));
        s.appendChild(c);
      });
    }
  }

  // 5. Local Deployment & Efficiency
  {
    const s = section('5. Local Deployment & Efficiency');
    const models = arr(data.deployment_efficiency?.models);
    s.appendChild(table(
      ['Model', 'Total B', 'Active B', 'Min Memory GB', 'Recommended GB', 'Quantization', 'Runtimes', 'Air-Gap', 'Notes', 'Evidence'],
      models.map(m => [
        value(m.model),
        m.total_parameters_b ?? '?',
        m.active_parameters_b ?? '?',
        m.minimum_memory_gb ?? '?',
        m.recommended_memory_gb ?? '?',
        join(m.quantization_options),
        join(m.supported_runtimes),
        value(m.air_gap_ready),
        [m.memory_notes, m.air_gap_notes].filter(Boolean).join(' '),
        evidence(m.evidence_ids)
      ])
    ));
  }

  // 6. Capability Matrix
  {
    const s = section('6. Capability Matrix');
    const rows = [];
    arr(data.capability_matrix).forEach(cap => {
      arr(cap.models).forEach(m => rows.push([
        value(cap.capability), value(m.model), value(m.status), value(m.notes, ''), evidence(m.evidence_ids)
      ]));
    });
    s.appendChild(table(['Capability', 'Model', 'Status', 'Notes', 'Evidence'], rows));
  }

  // 7. Competitor Deep Dives
  {
    const s = section('7. Competitor Deep Dives');
    const g = el('div', null, 'grid');
    arr(data.competitor_deep_dives).forEach(cmp => {
      const c = card(value(cmp.competitor) + ' — Threat: ' + value(cmp.threat_level));

      c.appendChild(el('strong', 'Where they beat the product'));
      c.appendChild(list(cmp.where_they_beat_product, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Where the product beats them'));
      c.appendChild(list(cmp.where_product_beats_them, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Recent Moves'));
      c.appendChild(list(cmp.recent_moves, x => {
        const li = el('li');
        li.appendChild(document.createTextNode(value(x.text, 'Insufficient evidence')));
        if (x.date) li.appendChild(document.createTextNode(' (' + x.date + ')'));
        li.appendChild(document.createTextNode(' '));
        li.appendChild(el('span', '[' + evidence(x.evidence_ids) + ']', 'small'));
        return li;
      }, 'No recent move identified.'));

      c.appendChild(el('strong', 'Implication'));
      c.appendChild(el('p', value(cmp.implication, 'Insufficient evidence')));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 8. Ecosystem & Adoption
  {
    const s = section('8. Ecosystem & Adoption');
    s.appendChild(table(
      ['Model', 'HF Downloads', 'Runtime Support', 'Quantization Ecosystem', 'Community Signals', 'Evidence'],
      arr(data.ecosystem_adoption).map(e => [
        value(e.model),
        (e.huggingface_downloads == null ? 'N/A' : e.huggingface_downloads) + (e.huggingface_downloads_period ? ' / ' + e.huggingface_downloads_period : ''),
        join(e.runtime_support),
        value(e.quantization_ecosystem),
        join(e.community_signals, '; ') + (e.notes ? ' — ' + e.notes : ''),
        evidence(e.evidence_ids)
      ])
    ));
  }

  // 9. Strategic Actions
  {
    const s = section('9. Strategic Actions');
    const actions = [...arr(data.strategic_actions)].sort((a, b) => (a.priority ?? 999) - (b.priority ?? 999));
    s.appendChild(table(
      ['Priority', 'Category', 'Action', 'Rationale', 'Evidence'],
      actions.map(a => [a.priority ?? '', value(a.category), value(a.action), value(a.rationale), evidence(a.evidence_ids)])
    ));
  }

  // 10. Evidence
  {
    const s = section('10. Evidence');
    const rows = arr(data.evidence).map(e => {
      const source = el('div');
      source.appendChild(safeLink(e.url, e.source_title || e.url || 'Source'));
      source.appendChild(el('br'));
      source.appendChild(el('span', value(e.publisher, ''), 'small'));

      const date = el('div');
      date.appendChild(document.createTextNode(value(e.published_date, 'N/A')));
      date.appendChild(el('br'));
      date.appendChild(el('span', 'Accessed ' + value(e.accessed_date, 'N/A'), 'small'));

      return [value(e.id), value(e.claim), source, date, value(e.source_type), value(e.confidence), value(e.quote_or_data, '')];
    });
    s.appendChild(table(['ID', 'Claim / Data', 'Source', 'Date', 'Type', 'Confidence', 'Supporting Data'], rows));
  }

  // Coverage Details
  {
    const s = section('Coverage Details');
    s.appendChild(table(
      ['Topic', 'Status', 'Notes'],
      arr(coverage.topics).map(t => [value(t.topic), value(t.status), value(t.notes, '')])
    ));
  }
})();
</script>

</body>
</html>
